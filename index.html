        let currentPercent = 0;
        const duration = 3000; // 3 seconds total
        const interval = 30; // Update every 30ms
        const step = 100 / (duration / interval);

        const statusMessages = [
            "Initializing Vault...",
            "Securing Connection...",
            "Loading Portfolio...",
            "Readying Workspace..."
        ];

        const timer = setInterval(() => {
            currentPercent += step;
            
            // Update percentage
            if (currentPercent >= 100) {
                currentPercent = 100;
                clearInterval(timer);
                
                // Final hand-off to the login experience
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 400);
            }
            
            percentageText.textContent = Math.floor(currentPercent) + '%';

            // Dynamic status message updates based on percentage milestones
            if (currentPercent > 25 && currentPercent < 50) progressText.textContent = statusMessages[1];
            if (currentPercent > 50 && currentPercent < 75) progressText.textContent = statusMessages[2];
            if (currentPercent > 75) progressText.textContent = statusMessages[3];

        }, interval);
    </script>
